name: Verify A.1a-2.2b exact SHA

on:
  push:
    branches: [verification/a1a22b-d2fa996d]

jobs:
  verify-exact-sha:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact A.1a-2.2b SHA
        uses: actions/checkout@v4
        with:
          ref: d2fa996d8d45277d4cba7946649f163e218df59f
          fetch-depth: 0
      - name: Assert exact SHA and clean tree
        run: |
          test "$(git rev-parse HEAD)" = "d2fa996d8d45277d4cba7946649f163e218df59f"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Configure Release warnings-as-errors
        run: cmake -S . -B build-a1a22b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=ON -DSOAM_WARNINGS_AS_ERRORS=ON
      - name: Build all configured targets
        run: cmake --build build-a1a22b --parallel 2
      - name: Verify registered test count
        run: |
          ctest --test-dir build-a1a22b -N | tee build-a1a22b/ctest-list.txt
          grep -q '^Total Tests: 27$' build-a1a22b/ctest-list.txt
      - name: Persistence live integration tests
        run: |
          ctest --test-dir build-a1a22b -R 'production_transition_evaluator_(tests|live_binding_tests)' --output-on-failure
      - name: Full CTest
        run: ctest --test-dir build-a1a22b --output-on-failure
      - name: Install sanity
        run: |
          cmake --install build-a1a22b --prefix "$PWD/stage"
          test ! -e stage/include/tests/support/production_transition_evaluator_live_scenarios.cpp
          test ! -e stage/include/detail/spatial_adaptive_mesh_internal_access.hpp
      - name: Structural persistence fixture gates
        run: |
          test "$(grep -c 'static void mutatePersistence' tests/support/production_transition_evaluator_live_scenarios.cpp)" = "1"
          test "$(grep -c 'static void evolve(' tests/support/production_transition_evaluator_live_scenarios.cpp || true)" = "0"
          test "$(grep -c 'static void reset(' tests/support/production_transition_evaluator_live_scenarios.cpp || true)" = "0"
          test "$(sed -n '/static void mutatePersistence(/,/^    }/p' tests/support/production_transition_evaluator_live_scenarios.cpp | grep -o 'mesh\.impl_' | wc -l)" = "3"
          grep -q 'LiveScenario::changed_persistence_stale' tests/support/production_transition_evaluator_live_scenarios.cpp
          grep -q 'LiveScenario::persistence_anti_resurrection' tests/support/production_transition_evaluator_live_scenarios.cpp
          grep -q 'LiveScenario::unrelated_relationship_isolation' tests/support/production_transition_evaluator_live_scenarios.cpp
          grep -q 'LiveScenario::reverse_direction_isolation' tests/support/production_transition_evaluator_live_scenarios.cpp
          test -z "$(git diff 92574c139b5816f08d709273f17d551b17aa0e22..HEAD -- src/detail cmake/templates CMakeLists.txt)"
