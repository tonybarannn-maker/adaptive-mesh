name: C++20 Adaptive Mesh CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  release-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DSOAM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify evidence file exists
        run: |
          test -f build/results/runtime_trace.jsonl
          test -s build/results/runtime_trace.jsonl

      - name: Generate SHA-256 manifest
        run: |
          sha256sum build/results/runtime_trace.jsonl \
            > build/results/verification_manifest.sha256

      - name: Display manifest
        run: cat build/results/verification_manifest.sha256

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            build/results/runtime_trace.jsonl
            build/results/verification_manifest.sha256

  debug-sanitizers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build-debug -S .
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON
          -DSOAM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-debug --config Debug

      - name: Run tests with sanitizers
        run: ctest --test-dir build-debug --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build-tsan -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DSOAM_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      - name: Build
        run: cmake --build build-tsan --config Release

      - name: Run tests with ThreadSanitizer
        run: ctest --test-dir build-tsan --output-on-failure
