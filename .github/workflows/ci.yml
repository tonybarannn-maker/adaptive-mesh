name: C++20 Adaptive Mesh CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON
          -DSOAM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify evidence file exists
        run: |
          test -f results/runtime_trace.jsonl
          test -s results/runtime_trace.jsonl

      - name: Generate SHA-256 manifest
        run: |
          sha256sum results/runtime_trace.jsonl \
            > results/verification_manifest.sha256

      - name: Display manifest
        run: cat results/verification_manifest.sha256

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            results/runtime_trace.jsonl
            results/verification_manifest.sha256
