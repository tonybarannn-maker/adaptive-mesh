name: C++20 Adaptive Mesh CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  normal-runtime:
    name: release-build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=ON -DSOAM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  profile-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-profile -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=OFF -DSOAM_WARNINGS_AS_ERRORS=ON
      - name: Build profile target
        run: cmake --build build-profile --target mesh_phase_profile mesh_benchmark mesh_benchmark_profile --parallel 2
      - name: Profile smoke
        run: ./build-profile/mesh_phase_profile 1 1
      - name: Normal/profile functional equivalence
        run: |
          ./build-profile/mesh_benchmark 1 2 > build-profile/normal.csv
          ./build-profile/mesh_benchmark_profile 1 2 > build-profile/profile.csv
          diff <(tail -n +3 build-profile/normal.csv | cut -d, -f5) <(tail -n +3 build-profile/profile.csv | cut -d, -f5)
      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  installed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and install
        run: |
          cmake -S . -B build-install -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$PWD/stage"
          cmake --build build-install --parallel 2
          cmake --install build-install
          cmake -DINSTALL_PREFIX="$PWD/stage" -P cmake/VerifyInstalledConsumer.cmake
      - name: Configure consumers
        run: cmake -S tests/package_consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
      - name: Build consumers
        run: cmake --build build-consumer --parallel 2
      - name: Run consumers
        run: |
          ./build-consumer/domain_consumer
          ./build-consumer/runtime_consumer
      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  debug-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DSOAM_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Build
        run: cmake --build build-debug --parallel 2
      - name: Test
        run: ctest --test-dir build-debug --output-on-failure
      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DSOAM_WARNINGS_AS_ERRORS=ON -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
      - name: Build
        run: cmake --build build-tsan --parallel 2
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
