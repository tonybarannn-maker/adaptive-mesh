name: verify-b-d7-2a1-c2

on:
  push:
    branches:
      - automation/verify-b-d7-2a1-c2

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: 41319449da24eae019d42defb918704ed0900fa1
          fetch-depth: 0

      - name: Assert exact candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "41319449da24eae019d42defb918704ed0900fa1"
          test -z "$(git status --porcelain)"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_EXAMPLES=ON \
            -DSOAM_WARNINGS_AS_ERRORS=ON

      - name: Registered tests and frozen proof
        run: |
          set -euo pipefail
          ctest --test-dir build -N | tee /tmp/ctest-list.txt
          grep -F 'Total Tests: 28' /tmp/ctest-list.txt
          ctest --test-dir build -R '^proof_token_delta_v0$' --output-on-failure

      - name: Build
        run: cmake --build build --parallel 2

      - name: Full suite
        run: ctest --test-dir build --output-on-failure

      - name: Structural gates
        run: |
          set -euo pipefail
          test "$(grep -o 'mesh\.impl_' tests/support/production_transition_evaluator_live_scenarios.cpp | wc -l)" -eq 15
          git diff --exit-code 4d8b6edddfe7fc81a2270bc5dde4207ec1f2dbf8 -- include cmake/templates CMakeLists.txt
          test "$(git diff --name-only 4d8b6edddfe7fc81a2270bc5dde4207ec1f2dbf8 | wc -l)" -eq 2
