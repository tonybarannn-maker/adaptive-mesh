name: verify-b-d7-2a1-e1b3d6ee

on:
  push:
    branches:
      - automation/verify-b-d7-2a1-e1b3d6ee

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation SHA
        uses: actions/checkout@v4
        with:
          ref: e1b3d6ee5f06a09c56272c9d148760f647dbcaf1
          fetch-depth: 0

      - name: Assert exact detached SHA and clean tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e1b3d6ee5f06a09c56272c9d148760f647dbcaf1"
          test -z "$(git status --porcelain)"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_EXAMPLES=ON \
            -DSOAM_WARNINGS_AS_ERRORS=ON

      - name: Registered tests and frozen proof
        run: |
          set -euo pipefail
          ctest --test-dir build -N | tee /tmp/ctest-list.txt
          grep -F 'Total Tests: 28' /tmp/ctest-list.txt
          ctest --test-dir build -R '^proof_token_delta_v0$' --output-on-failure

      - name: Build
        run: cmake --build build --parallel 2

      - name: Full suite
        run: ctest --test-dir build --output-on-failure

      - name: Install sanity
        run: |
          set -euo pipefail
          rm -rf stage
          cmake --install build --prefix "$PWD/stage"
          test -f stage/include/system_architecture.hpp
          test -f stage/include/production_transition_evaluator.hpp
          test -f stage/lib/cmake/AdaptiveMesh/AdaptiveMeshConfig.cmake
          test ! -e stage/tests/proofs/token_delta_v0.py

      - name: Structural gates
        run: |
          set -euo pipefail
          test "$(grep -o 'mesh\.impl_' tests/support/production_transition_evaluator_live_scenarios.cpp | wc -l)" -eq 15
          git diff --exit-code 972445f7f7651c71ea23fc893998792c68b7be51 -- include cmake/templates CMakeLists.txt
          test "$(git diff --name-only 4d8b6edddfe7fc81a2270bc5dde4207ec1f2dbf8 e1b3d6ee5f06a09c56272c9d148760f647dbcaf1 | wc -l)" -eq 2
